<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Abstract masterplan of Dubai">
  <defs>
    <linearGradient id="dxb-sea" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d1418"/>
      <stop offset="1" stop-color="#101b21"/>
    </linearGradient>
    <linearGradient id="dxb-land" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1b1e22"/>
      <stop offset="1" stop-color="#131518"/>
    </linearGradient>
    <pattern id="dxb-grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.35" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#dxb-land)"/>

  <!-- Coastline running north-east to south-west, with the gulf to the upper left -->
  <path d="M-20 -20 L 980 -20 C 820 140, 560 300, 380 470 C 240 600, 120 760, 40 1020 L -20 1020 Z"
        fill="url(#dxb-sea)" stroke="#20303a" stroke-width="1.5"/>
  <g stroke="#24343d" stroke-width="1" fill="none" opacity="0.5">
    <path d="M900 -20 C 760 130, 520 290, 350 455 C 215 585, 100 745, 20 1020"/>
    <path d="M820 -20 C 690 120, 470 275, 310 435 C 185 560, 78 720, 0 1000"/>
  </g>

  <!-- The creek, cutting inland from the coast toward the wetlands -->
  <path d="M470 380 C 620 470, 760 520, 900 560 C 1020 594, 1120 640, 1180 720"
        fill="none" stroke="#16242c" stroke-width="46" stroke-linecap="round"/>
  <path d="M470 380 C 620 470, 760 520, 900 560 C 1020 594, 1120 640, 1180 720"
        fill="none" stroke="#1d2f39" stroke-width="1.25"/>

  <!-- Ras Al Khor wetland basin -->
  <g fill="#142026" stroke="#7fa88a" stroke-width="1" stroke-opacity="0.3">
    <path d="M1120 690 C 1230 640, 1400 660, 1450 750 C 1494 830, 1400 910, 1270 906 C 1140 902, 1060 830, 1070 760 C 1076 722, 1094 702, 1120 690 Z"/>
  </g>
  <g stroke="#7fa88a" stroke-width="0.75" opacity="0.22" fill="none">
    <path d="M1140 780 H1420 M1150 820 H1400 M1180 740 H1380"/>
  </g>

  <!-- Arterial road grid -->
  <g stroke="#3d434c" stroke-width="1.15" fill="none" opacity="0.75">
    <path d="M980 -20 C 900 220, 820 420, 700 620 C 600 786, 500 900, 420 1020"/>
    <path d="M1200 -20 C 1120 240, 1030 450, 900 660 C 800 820, 700 920, 620 1020"/>
    <path d="M300 520 L 1600 300"/>
    <path d="M180 700 L 1600 470"/>
  </g>

  <!-- Downtown tower cluster -->
  <g fill="#c8a97e" opacity="0.16">
    <rect x="726" y="290" width="26" height="34"/>
    <rect x="762" y="308" width="18" height="22"/>
    <rect x="700" y="320" width="20" height="22"/>
    <rect x="746" y="336" width="16" height="18"/>
  </g>
  <g fill="#c8a97e" opacity="0.13">
    <rect x="486" y="596" width="24" height="30"/>
    <rect x="520" y="614" width="18" height="20"/>
    <rect x="462" y="624" width="18" height="20"/>
  </g>

  <!-- Creek Harbour parcels -->
  <g fill="none" stroke="#2a2e35" stroke-width="1">
    <rect x="840" y="380" width="180" height="120"/>
    <rect x="1040" y="360" width="150" height="130"/>
    <rect x="860" y="600" width="160" height="110"/>
  </g>
  <g fill="#c8a97e" opacity="0.14">
    <rect x="880" y="410" width="34" height="42"/>
    <rect x="926" y="428" width="22" height="26"/>
    <rect x="1074" y="392" width="30" height="38"/>
  </g>

  <g fill="none" stroke="#c8a97e" stroke-width="0.75" opacity="0.26">
    <circle cx="928" cy="430" r="120"/>
  </g>

  <rect width="1600" height="1000" fill="url(#dxb-grain)"/>
</svg>
